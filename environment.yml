# Conda environment for the CAP 6671 RL baseline.
#
#   conda env create -f environment.yml
#   conda activate cap6671
#
# Everything is pinned, including transitive dependencies, so this file alone
# rebuilds the environment the recorded runs used. Rebuilt and verified on
# macOS 26.5 / Apple silicon (osx-arm64), 2026-08-20.
#
# Notes on the pins:
#   - python 3.11 is deliberate. Do not downgrade it to make a package install.
#   - torch comes from PyPI, not conda-forge. The PyPI arm64 wheel is the one
#     that carries working Apple MPS support; the conda-forge osx-arm64 build
#     lags it. CPU is still the default device, see README.
#   - conda-forge is named explicitly because this machine has no default
#     channel configured. Without the channel line, `conda env create` fails
#     with PackagesNotFoundError on python itself.
name: cap6671
channels:
  - conda-forge
dependencies:
  - python=3.11.15
  - pip=26.2.1
  - setuptools=84.0.0
  - wheel=0.48.0
  - packaging=26.3
  - pip:
      # direct dependencies
      - gymnasium==1.3.0
      - minigrid==3.1.0
      - torch==2.13.0
      - tensorboard==2.21.0
      - stable_baselines3==2.9.0
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      # transitive, pinned so the rebuild is exact
      - absl-py==2.5.0
      - antlr4-python3-runtime==4.9.3
      - cloudpickle==3.1.2
      - Farama-Notifications==0.0.6
      - filelock==3.32.3
      - fsspec==2026.7.0
      - grpcio==1.83.0
      - Jinja2==3.1.6
      - Markdown==3.10.3
      - MarkupSafe==3.0.3
      - mpmath==1.3.0
      - networkx==3.6.1
      - numpy==2.4.6
      - pillow==12.3.0
      - protobuf==7.36.0
      - pygame-ce==2.5.8
      - PyYAML==6.0.3
      - sympy==1.14.0
      - tensorboard-data-server==0.7.2
      - typing_extensions==4.16.0
      - Werkzeug==3.1.8
